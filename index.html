<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Жидкий Свет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500&display=swap">
<style>
/* Layout: one full-bleed WebGL2 canvas is the page. A nameplate sits top-left and fades after the first touch;
   a glass pill toolbar sits bottom-right; a centred card appears only when WebGL2 is missing.
   In screensaver mode (.saver) the chrome hides and comes back for a moment when the pointer moves (.ui-visible). */
:root {
  --bg: #05060c;                      /* deep ink with a blue bias: the fluid's ground */
  --fg: #eef0ff;
  --muted: rgba(238, 240, 255, 0.62);
  --glass: rgba(10, 12, 24, 0.55);
  --line: rgba(238, 240, 255, 0.16);
  --accent: #7ef0ff;                  /* cyan glow */
  --accent-2: #ff6ad5;                /* magenta glow */
  --card-bg: #0d1020;
  --card-fg: #eef0ff;
  --font-display: 'Unbounded', 'Arial Black', 'Segoe UI', sans-serif;
  --font-ui: 'Golos Text', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
/* The canvas is additive light and stays dark in every theme; only the fallback card follows the host theme. */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --card-bg: #f6f4ef; --card-fg: #16182a; }
}
:root[data-theme="light"] { --card-bg: #f6f4ef; --card-fg: #16182a; }

html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; overflow: hidden; background: var(--bg); color: var(--fg);
  font-family: var(--font-ui); -webkit-font-smoothing: antialiased; overscroll-behavior: none;
}
#c {
  position: fixed; inset: 0; width: 100%; height: 100%; display: block;
  touch-action: none; cursor: crosshair; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
.plate {
  position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(env(safe-area-inset-top, 0px) + 18px);
  max-width: min(88vw, 520px); pointer-events: none;
  transition: opacity 1.4s ease, transform 1.4s ease;
}
.plate.faded { opacity: 0; transform: translateY(-6px); }
.plate h1 {
  margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, 3.4vw, 36px);
  letter-spacing: -0.01em; line-height: 1.05; text-wrap: balance;
  text-shadow: 0 0 28px rgba(126, 240, 255, 0.35), 0 0 2px rgba(238, 240, 255, 0.6);
}
.plate p { margin: 10px 0 0; color: var(--muted); font-size: 14px; line-height: 1.45; max-width: 46ch; }
.bar {
  position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100vw - 32px);
  transition: opacity .6s ease;
}
.bar button {
  appearance: none; border: 1px solid var(--line); background: var(--glass); color: var(--fg);
  font: 500 13px/1 var(--font-ui); letter-spacing: 0.02em; padding: 10px 14px; border-radius: 999px;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; transition: border-color .2s, background .2s;
}
.bar button:hover { border-color: rgba(238, 240, 255, 0.4); }
.bar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); transition: background .2s, box-shadow .2s; }
.bar button[aria-pressed="false"] .dot { background: var(--line); box-shadow: none; }
.bar .dot.live { background: var(--accent-2); box-shadow: 0 0 10px var(--accent-2); animation: pulse 1.2s ease-in-out infinite; }
.bar button[aria-pressed="false"] .dot.live { animation: none; }
@keyframes pulse { 50% { transform: scale(1.5); opacity: .7; } }
.bar .swatch { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 76px); transform: translateX(-50%);
  max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 12px; background: var(--glass); border: 1px solid var(--line);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); font-size: 14px; color: var(--fg); pointer-events: none;
  opacity: 0; transition: opacity .3s ease; text-align: center;
}
.toast.show { opacity: 1; }
/* screensaver: hide chrome and the cursor until the pointer moves */
.saver .plate { opacity: 0; }
.saver .bar { opacity: 0; pointer-events: none; }
.saver.ui-visible .bar { opacity: 1; pointer-events: auto; }
.saver:not(.ui-visible) #c { cursor: none; }
.fallback {
  position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; background: var(--bg);
}
.fallback .card {
  background: var(--card-bg); color: var(--card-fg); border-radius: 16px; padding: 28px 28px 24px; max-width: 480px; width: 100%;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
}
.fallback h2 { margin: 0 0 10px; font-family: var(--font-display); font-size: 22px; font-weight: 700; text-wrap: balance; }
.fallback p { margin: 0; line-height: 1.5; font-size: 15px; }
.fallback code { font-size: 12px; opacity: .7; display: block; margin-top: 14px; word-break: break-word; }
@media (prefers-reduced-motion: reduce) { .plate, .bar, .toast { transition: none; } .bar .dot.live { animation: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="plate" id="plate">
  <h1>Жидкий Свет</h1>
  <p>Ведите курсором или пальцем: вы рисуете светом и играете звуком. Нажатие даёт вспышку. Включите микрофон, и свет станцует под вашу музыку.</p>
</div>
<div class="bar" id="bar">
  <button id="btn-palette" type="button" title="Сменить палитру (P)"><span class="swatch" aria-hidden="true"></span><span id="palette-name">Аврора</span></button>
  <button id="btn-sound" type="button" aria-pressed="true" title="Звук (M)"><span class="dot" aria-hidden="true"></span>звук</button>
  <button id="btn-mic" type="button" aria-pressed="false" title="Реагировать на микрофон"><span class="dot live" aria-hidden="true"></span>микрофон</button>
  <button id="btn-full" type="button" aria-pressed="false" title="Заставка на весь экран (F, выход — Esc)">на весь экран</button>
  <button id="btn-reset" type="button" title="Очистить (Space)">очистить</button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="fallback" id="fallback" hidden>
  <div class="card">
    <h2>Нужен WebGL2</h2>
    <p id="fallback-msg">Этот браузер не поддерживает WebGL2 или рендер в float-текстуры. Откройте страницу в актуальном Chrome, Firefox, Edge или Safari.</p>
    <code id="fallback-detail"></code>
  </div>
</div>
<script id="audio-engine">
/* Audio engine. Self-contained so it can be rendered offline for analysis: takes any BaseAudioContext.
   Design notes (v2): notes are quantised to a 16th-note grid and the delay is a tempo-synced dotted eighth,
   so fast gestures produce a groove instead of a 14-notes-per-second flutter; the drone follows a
   fast-attack / slow-release envelope instead of the raw per-frame fluid energy; detune is narrowed from
   ±7/6 to ±4 cents (slow chorus, not a half-hertz throb); the sub stays out of the reverb; a gentle glue
   compressor and a brickwall limiter replace the pumping one; the reverb tail is darkened so it stops fizzing. */
window.createLiquidAudio = function createLiquidAudio(ctx, opts) {
  opts = opts || {};
  const BPM = opts.bpm || 112, GRID = 60 / BPM / 4, DELAY = 60 / BPM * 0.75;
  const SCALE = [0, 2, 4, 7, 9];
  const MAX_VOICES = 12;
  let enabled = opts.enabled !== false;

  function makeIR(seconds, decay, tone) {
    const rate = ctx.sampleRate, len = Math.floor(rate * seconds), pre = Math.floor(rate * 0.015), buf = ctx.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch); let lp = 0;
      for (let i = pre; i < len; i++) {
        lp += ((Math.random() * 2 - 1) - lp) * tone;             // one-pole lowpass: the tail darkens instead of fizzing
        const k = (i - pre) / (len - pre);
        d[i] = lp * Math.pow(1 - k, decay);
      }
    }
    return buf;
  }
  function filter(type, freq, q) { const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; if (q != null) f.Q.value = q; return f; }
  function gain(v) { const g = ctx.createGain(); g.gain.value = v; return g; }

  // master chain: tone shelf -> glue -> limiter -> master
  const master = gain(enabled ? 0.8 : 0);
  const limiter = ctx.createDynamicsCompressor(); limiter.threshold.value = -3; limiter.knee.value = 3; limiter.ratio.value = 20; limiter.attack.value = 0.002; limiter.release.value = 0.12;
  const glue = ctx.createDynamicsCompressor(); glue.threshold.value = -16; glue.knee.value = 12; glue.ratio.value = 2.5; glue.attack.value = 0.02; glue.release.value = 0.5;
  const tone = filter('highshelf', 5500); tone.gain.value = -3;
  tone.connect(glue); glue.connect(limiter); limiter.connect(master); master.connect(ctx.destination);

  // sends: dry, darkened reverb (highpassed so the lows stay clean), tempo-synced feedback delay
  const bus = gain(1), dry = gain(0.8);
  const revHP = filter('highpass', 140), conv = ctx.createConvolver(), wet = gain(0.42);
  conv.buffer = makeIR(3.2, 2.8, 0.32);
  const dHP = filter('highpass', 220), delay = ctx.createDelay(2), dLP = filter('lowpass', 1900), fb = gain(0.4), dmix = gain(0.28);
  delay.delayTime.value = DELAY;
  bus.connect(dry); bus.connect(revHP); revHP.connect(conv); conv.connect(wet);
  bus.connect(dHP); dHP.connect(delay); delay.connect(dLP); dLP.connect(fb); fb.connect(delay); dLP.connect(dmix);
  dry.connect(tone); wet.connect(tone); dmix.connect(tone);

  // drone: two barely-detuned saws + a sub, through a dark lowpass that opens with the fluid's energy
  const droneGain = gain(0), dlpf = filter('lowpass', 260, 0.9);
  for (const det of [-4, 4]) { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 65.41; o.detune.value = det; o.connect(dlpf); o.start(); }
  const sub = ctx.createOscillator(); sub.type = 'sine'; sub.frequency.value = 32.7; sub.connect(dlpf); sub.start();
  const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07; const lfoG = gain(50); lfo.connect(lfoG); lfoG.connect(dlpf.frequency); lfo.start();
  dlpf.connect(droneGain); droneGain.connect(dry); const droneRev = gain(0.5); droneGain.connect(droneRev); droneRev.connect(revHP);

  const voices = []; let lastSlot = -1;
  function note(xn, yn, speed) {
    if (!enabled) return false;
    const t = ctx.currentTime;
    const slot = Math.ceil((t + 0.005) / GRID);
    if (slot === lastSlot) return false;                         // one note per grid slot
    lastSlot = slot;
    const when = slot * GRID;
    for (let i = voices.length - 1; i >= 0; i--) if (voices[i].end <= t) voices.splice(i, 1);
    while (voices.length >= MAX_VOICES) { const v = voices.shift(); v.g.gain.cancelScheduledValues(t); v.g.gain.setTargetAtTime(0, t, 0.03); }
    const deg = Math.max(0, Math.min(9, Math.floor(xn * 10)));
    const midi = 48 + SCALE[deg % 5] + Math.floor(deg / 5) * 12 + (yn > 0.62 ? 12 : 0);
    const freq = 440 * Math.pow(2, (midi - 69) / 12);
    const vel = Math.min(1, 0.35 + speed * 1.2);
    const peak = 0.17 * vel / Math.sqrt(Math.max(1, voices.length / 3)); // polyphony compensation
    const end = when + 2.2;
    const g = ctx.createGain(); g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(peak, when + 0.008); g.gain.setTargetAtTime(0, when + 0.05, 0.42);
    const f = filter('lowpass', 600 + 3000 * yn * vel, 1.2); f.frequency.setValueAtTime(600 + 3000 * yn * vel, when); f.frequency.exponentialRampToValueAtTime(300, when + 1.2);
    const pan = ctx.createStereoPanner(); pan.pan.value = (xn - 0.5) * 1.3;
    const o1 = ctx.createOscillator(); o1.type = 'triangle'; o1.frequency.value = freq;
    const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 2; const o2g = gain(0.3);
    const o3 = ctx.createOscillator(); o3.type = 'sine'; o3.frequency.value = freq * 3; const o3g = gain(0.08);
    o1.connect(f); o2.connect(o2g); o2g.connect(f); o3.connect(o3g); o3g.connect(f); f.connect(g); g.connect(pan); pan.connect(bus);
    o1.start(when); o2.start(when); o3.start(when); o1.stop(end); o2.stop(end); o3.stop(end);
    voices.push({ g, end });
    return true;
  }
  function burst(xn) {
    if (!enabled) return;
    const t = ctx.currentTime;
    const pan = ctx.createStereoPanner(); pan.pan.value = (xn - 0.5); pan.connect(bus);
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.45);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.45, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
    o.connect(g); g.connect(pan); o.start(t); o.stop(t + 0.85);
    const c = ctx.createOscillator(); c.type = 'triangle'; c.frequency.value = 1800;      // short click for the transient
    const cg = ctx.createGain(); cg.gain.setValueAtTime(0.12, t); cg.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
    c.connect(cg); cg.connect(pan); c.start(t); c.stop(t + 0.04);
  }
  let env = 0;
  function update(energy, dt) {
    dt = dt || 1 / 60;
    const target = Math.min(1, Math.max(0, energy));
    const tau = target > env ? 0.12 : 1.4;                      // swells quickly, lingers slowly
    env += (target - env) * (1 - Math.exp(-dt / tau));
    const t = ctx.currentTime;
    droneGain.gain.setTargetAtTime(0.1 * env, t, 0.08);
    dlpf.frequency.setTargetAtTime(240 + 760 * env, t, 0.12);
  }
  function setEnabled(on) { enabled = on; master.gain.setTargetAtTime(on ? 0.8 : 0, ctx.currentTime, 0.05); }
  return { ctx, note, burst, update, setEnabled, get enabled() { return enabled; }, get voices() { return voices.length; }, grid: GRID, bpm: BPM };
};
</script>
<script>
(() => {
'use strict';
const canvas = document.getElementById('c');
const plate = document.getElementById('plate');
const bar = document.getElementById('bar');
const fallback = document.getElementById('fallback');
const fallbackDetail = document.getElementById('fallback-detail');
const toastEl = document.getElementById('toast');

function fail(detail) {
  fallback.hidden = false; canvas.hidden = true; bar.hidden = true; plate.hidden = true;
  fallbackDetail.textContent = detail || '';
  console.error('Жидкий Свет: ' + detail);
}
let toastTimer = 0;
function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2800); }

const isTouch = matchMedia('(pointer: coarse)').matches;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const gl = canvas.getContext('webgl2', { alpha: false, depth: false, stencil: false, antialias: false, powerPreference: 'high-performance' });
if (!gl) { fail('WebGL2 context unavailable'); return; }
const extFloat = gl.getExtension('EXT_color_buffer_float');
const extHalf = extFloat ? null : gl.getExtension('EXT_color_buffer_half_float');
if (!extFloat && !extHalf) { fail('EXT_color_buffer_float / EXT_color_buffer_half_float missing'); return; }
gl.getExtension('OES_texture_float_linear');

// ---------- format probing ----------
function supportsRender(internalFormat, format) {
  const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, 4, 4, 0, format, gl.HALF_FLOAT, null);
  const fbo = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.deleteFramebuffer(fbo); gl.deleteTexture(tex);
  return ok;
}
function pickFormat(internalFormat, format) {
  if (supportsRender(internalFormat, format)) return { internalFormat, format };
  if (internalFormat === gl.R16F) return pickFormat(gl.RG16F, gl.RG);
  if (internalFormat === gl.RG16F) return pickFormat(gl.RGBA16F, gl.RGBA);
  return null;
}
const fmtRGBA = pickFormat(gl.RGBA16F, gl.RGBA);
const fmtRG = pickFormat(gl.RG16F, gl.RG);
const fmtR = pickFormat(gl.R16F, gl.RED);
if (!fmtRGBA || !fmtRG || !fmtR) { fail('half-float render targets unsupported'); return; }

// ---------- config ----------
const config = {
  SIM_RES: 128, DYE_RES: isTouch ? 512 : 1024,
  DENSITY_DISSIPATION: 0.8, VELOCITY_DISSIPATION: 0.22, PRESSURE: 0.8, PRESSURE_ITERATIONS: 20, CURL: 28,
  SPLAT_RADIUS: 0.2, SPLAT_FORCE: 6000,
  BLOOM_ITERATIONS: isTouch ? 6 : 8, BLOOM_RESOLUTION: 256, BLOOM_INTENSITY: 0.8, BLOOM_THRESHOLD: 0.6, BLOOM_SOFT_KNEE: 0.7,
  SUNRAYS_RESOLUTION: 196, SUNRAYS_WEIGHT: 1.0,

// ---------- shaders ----------
const HEAD = '#version 300 es\nprecision highp float;\nprecision mediump sampler2D;\n';
const baseVS = HEAD + `
layout(location=0) in vec2 aPosition;
out vec2 vUv; out vec2 vL; out vec2 vR; out vec2 vT; out vec2 vB;
uniform vec2 texelSize;
void main() {
  vUv = aPosition * 0.5 + 0.5;
  vL = vUv - vec2(texelSize.x, 0.0); vR = vUv + vec2(texelSize.x, 0.0);
  vT = vUv + vec2(0.0, texelSize.y); vB = vUv - vec2(0.0, texelSize.y);
  gl_Position = vec4(aPosition, 0.0, 1.0);
}`;
const blurVS = HEAD + `
layout(location=0) in vec2 aPosition;
out vec2 vUv; out vec2 vL; out vec2 vR;
uniform vec2 texelSize;
void main() {
  vUv = aPosition * 0.5 + 0.5;
  vL = vUv - texelSize; vR = vUv + texelSize;
  gl_Position = vec4(aPosition, 0.0, 1.0);
}`;
const FS = {
copy: `in vec2 vUv; uniform sampler2D uTexture; out vec4 o;
void main(){ o = texture(uTexture, vUv); }`,
clear: `in vec2 vUv; uniform sampler2D uTexture; uniform float value; out vec4 o;
void main(){ o = value * texture(uTexture, vUv); }`,
blur: `in vec2 vUv; in vec2 vL; in vec2 vR; uniform sampler2D uTexture; out vec4 o;
void main(){ vec4 s = texture(uTexture, vUv) * 0.29411764; s += texture(uTexture, vL) * 0.35294117; s += texture(uTexture, vR) * 0.35294117; o = s; }`,
splat: `in vec2 vUv; uniform sampler2D uTarget; uniform float aspectRatio; uniform vec3 color; uniform vec2 point; uniform float radius; out vec4 o;

advection: `in vec2 vUv; uniform sampler2D uVelocity; uniform sampler2D uSource; uniform vec2 texelSize; uniform float dt; uniform float dissipation; out vec4 o;
void main(){ vec2 coord = vUv - dt * texture(uVelocity, vUv).xy * texelSize; vec4 r = texture(uSource, coord); float decay = 1.0 + dissipation * dt; o = r / decay; }`,
divergence: `in vec2 vUv; in vec2 vL; in vec2 vR; in vec2 vT; in vec2 vB; uniform sampler2D uVelocity; out vec4 o;
void main(){
  float L = texture(uVelocity, vL).x; float R = texture(uVelocity, vR).x; float T = texture(uVelocity, vT).y; float B = texture(uVelocity, vB).y;
  vec2 C = texture(uVelocity, vUv).xy;
  if (vL.x < 0.0) { L = -C.x; } if (vR.x > 1.0) { R = -C.x; } if (vT.y > 1.0) { T = -C.y; } if (vB.y < 0.0) { B = -C.y; }
  o = vec4(0.5 * (R - L + T - B), 0.0, 0.0, 1.0); }`,
curl: `in vec2 vUv; in vec2 vL; in vec2 vR; in vec2 vT; in vec2 vB; uniform sampler2D uVelocity; out vec4 o;
void main(){ float L = texture(uVelocity, vL).y; float R = texture(uVelocity, vR).y; float T = texture(uVelocity, vT).x; float B = texture(uVelocity, vB).x; o = vec4(0.5 * (R - L - T + B), 0.0, 0.0, 1.0); }`,
vorticity: `in vec2 vUv; in vec2 vL; in vec2 vR; in vec2 vT; in vec2 vB; uniform sampler2D uVelocity; uniform sampler2D uCurl; uniform float curl; uniform float dt; out vec4 o;
void main(){
  float L = texture(uCurl, vL).x; float R = texture(uCurl, vR).x; float T = texture(uCurl, vT).x; float B = texture(uCurl, vB).x; float C = texture(uCurl, vUv).x;
  vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L)); force /= length(force) + 0.0001; force *= curl * C; force.y *= -1.0;

  lastInteraction = performance.now();
  if (!plateFaded) { plateFaded = true; setTimeout(() => plate.classList.add('faded'), 1800); }
}
canvas.addEventListener('pointerdown', e => {
  const p = pointers.get(e.pointerId) || newPointer(e.pointerId);
  const t = toTex(e); p.x = t.x; p.y = t.y; p.dx = 0; p.dy = 0; p.down = true; p.moved = false;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  ensureAudio(); interacted();
  burstAt(p.x, p.y, p.seed, 1);
  if (audio) { audio.burst(p.x); audio.note(p.x, p.y, 0.6); }
  energy = Math.min(1.5, energy + 0.5);
});
canvas.addEventListener('pointermove', e => {
  let p = pointers.get(e.pointerId);
  if (!p) { if (e.pointerType !== 'mouse') return; p = newPointer(e.pointerId); const t = toTex(e); p.x = t.x; p.y = t.y; return; }
  if (e.pointerType !== 'mouse' && !p.down) return;
  const t = toTex(e); const d = correctDelta(t.x - p.x, t.y - p.y);
  p.x = t.x; p.y = t.y; p.dx = d.dx; p.dy = d.dy; p.moved = Math.abs(d.dx) > 0 || Math.abs(d.dy) > 0;
  if (p.moved) {
    interacted();
    const dist = Math.hypot(d.dx, d.dy); p.travel += dist;
    if (p.travel > 0.03 && audio && audio.note(p.x, p.y, Math.min(1, dist * 40))) p.travel = 0;
    if (p.down) ensureAudio();
  }
});
function endPointer(e) { const p = pointers.get(e.pointerId); if (!p) return; p.down = false; if (e.pointerType !== 'mouse') pointers.delete(e.pointerId); }
canvas.addEventListener('pointerup', endPointer); canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') pointers.delete(e.pointerId); });
function applyInputs(now) {
  for (const p of pointers.values()) {
    if (!p.moved) continue; p.moved = false;
    const gain = p.down ? 1.8 : 1;
    const c = pointerColor(p.seed, now, gain);
    const speed = Math.hypot(p.dx, p.dy);
    energy = Math.min(1.5, energy + speed * 18);
    splat(p.x, p.y, p.dx * config.SPLAT_FORCE, p.dy * config.SPLAT_FORCE, c, p.down ? 1.5 : 1);
  }
}
function randomSplats(n, strength) {
  for (let i = 0; i < n; i++) {
    const c = pointerColor(Math.random(), performance.now(), 4 * strength);
    const x = 0.15 + Math.random() * 0.7, y = 0.15 + Math.random() * 0.7;
    splat(x, y, (Math.random() - 0.5) * 1800 * strength, (Math.random() - 0.5) * 1800 * strength, c, 1 + Math.random());
  }
}

// ---------- autopilot: two wandering light sources paint on their own when nobody is touching the canvas ----------
const wanderers = [];
function makeWanderer() { return { x: 0.3 + Math.random() * 0.4, y: 0.3 + Math.random() * 0.4, a: Math.random() * 6.2832, turn: 0, seed: Math.random() }; }
function autopilot(now, dt, count) {
  while (wanderers.length < count) wanderers.push(makeWanderer());
  for (let i = 0; i < count; i++) { const w = wanderers[i];
    w.turn += ((Math.random() - 0.5) * 7 - w.turn * 0.8) * dt;
    w.a += w.turn * dt * 4;
    const cx = 0.5 - w.x, cy = 0.5 - w.y;
    if (Math.hypot(cx, cy) > 0.32) { let da = Math.atan2(cy, cx) - w.a; da = Math.atan2(Math.sin(da), Math.cos(da)); w.a += da * 2.5 * dt; }
    const dx = Math.cos(w.a) * 0.18 * dt, dy = Math.sin(w.a) * 0.18 * dt;
    w.x += dx; w.y += dy;
    const d = correctDelta(dx, dy);
    splat(w.x, w.y, d.dx * config.SPLAT_FORCE * 0.5, d.dy * config.SPLAT_FORCE * 0.5, pointerColor(w.seed, now, 0.14), 0.7); // faint: a slow trace, not a flood
  }
}

// ---------- controls ----------
const btnPalette = document.getElementById('btn-palette'), btnSound = document.getElementById('btn-sound'), btnMic = document.getElementById('btn-mic');
const btnFull = document.getElementById('btn-full'), btnReset = document.getElementById('btn-reset');
const paletteName = document.getElementById('palette-name');
function nextPalette() { paletteIndex = (paletteIndex + 1) % palettes.length; paletteName.textContent = palettes[paletteIndex].name; randomSplats(3, 0.6); }
function reset() {
  P.clear.use(); gl.uniform1f(P.clear.u.value, 0);
  for (const f of [dye, velocity, pressure]) { gl.uniform1i(P.clear.u.uTexture, f.read.attach(0)); blit(f.write); f.swap(); }
}
let saver = false, uiTimer = 0;
function setSaver(on) {
  saver = on; document.body.classList.toggle('saver', on); document.body.classList.remove('ui-visible');
  btnFull.setAttribute('aria-pressed', String(on)); btnFull.textContent = on ? 'выйти' : 'на весь экран';
  const el = document.documentElement;
  if (on) { if (el.requestFullscreen) el.requestFullscreen().catch(() => {}); toast('Заставка. Esc, чтобы выйти'); }
  else if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
}
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && saver) setSaver(false); });
function showUi() {
  if (!saver) return;
  document.body.classList.add('ui-visible'); clearTimeout(uiTimer);
  uiTimer = setTimeout(() => document.body.classList.remove('ui-visible'), 2500);
}
window.addEventListener('pointermove', showUi); window.addEventListener('pointerdown', showUi);
btnPalette.addEventListener('click', () => { ensureAudio(); nextPalette(); });
btnSound.addEventListener('click', () => { ensureAudio(); setSound(!soundOn); });
btnMic.addEventListener('click', toggleMic);
btnFull.addEventListener('click', () => { ensureAudio(); setSaver(!saver); });
btnReset.addEventListener('click', reset);
window.addEventListener('keydown', e => {
  if (e.code === 'Escape') { if (saver) setSaver(false); return; }
  if (e.target !== document.body) return;
  if (e.code === 'Space') { e.preventDefault(); reset(); }
  else if (e.code === 'KeyP') nextPalette();
  else if (e.code === 'KeyM') { ensureAudio(); setSound(!soundOn); }
  else if (e.code === 'KeyF') { ensureAudio(); setSaver(!saver); }
});

// ---------- loop ----------
function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, isTouch ? 2 : 1.5);
  const w = Math.max(1, Math.floor(canvas.clientWidth * dpr)), h = Math.max(1, Math.floor(canvas.clientHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; return true; }
  return false;
}
resizeCanvas(); initFramebuffers();
randomSplats(isTouch ? 5 : 8, 1);

let lastTime = performance.now(), frames = 0, slowFrames = 0, tuned = false;
function frame(now) {
  const real = Math.min(0.1, Math.max(0.001, (now - lastTime) / 1000)); lastTime = now;
  if (real > 0.034) slowFrames++; frames++;
  const dt = Math.min(Math.max(real, 1 / 120), 1 / 30);
  if (!tuned && frames > 90) { // one-shot auto quality: drop dye resolution on slow machines
    tuned = true;
    if (slowFrames > 30 && config.DYE_RES > 512) { config.DYE_RES = 512; config.BLOOM_ITERATIONS = 5; initFramebuffers(); }
  }
  if (resizeCanvas()) initFramebuffers();
  applyInputs(now);
  if (mic.on && mic.analyser) micFrame(now, real);
  if (!reduceMotion && (saver || now - lastInteraction > 6000)) autopilot(now, real, saver ? 2 : 1);
  energy *= 0.975;
  step(dt); render();
  if (audio) audio.update(energy, real);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__liquidLight = { get audioState() { return audio ? audio.ctx.state : 'none'; }, get energy() { return energy; }, get dyeRes() { return [dye.width, dye.height]; }, get frames() { return frames; }, get mic() { return mic.on; }, get saver() { return saver; } };
})();
</script>
